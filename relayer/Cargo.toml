[package]
name = "zk-hedge-relayer"
version = "0.1.0"
edition = "2021"
description = "Intent routing and Zebra/Lightwalletd relayer for ZK-Hedge"
license = "MIT"

[dependencies]
anyhow = "1"
ethers = { version = "2.0.14", default-features = false, features = ["rustls", "ws"] }
axum = "0.8"
frost-ed25519 = "2.2"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zcash_client_backend = { version = "0.25.0", default-features = false, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_keys = { version = "0.17.0", default-features = false, features = ["orchard"] }
zcash_primitives = { version = "0.31.0", default-features = false }
zcash_protocol = "0.11.0"
